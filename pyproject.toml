[project]
name = "alg-models"
version = "0.1.0"
description = "Cloud-native hierarchical time-series anomaly detection with explainable causal root-cause localization"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.4",
    "websockets>=12.0",
]

[project.optional-dependencies]
torch = [
    "time-rcd",
    "torch>=2.2",
]
llm = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
time-rcd = { git = "https://github.com/thu-sail-lab/Time-RCD.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# disable ROS/ament pytest plugins injected via /opt/ros on this host
addopts = "-q -p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"
timeout = 600

[tool.ruff]
line-length = 100
