<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" style="background:#fff"><text x="80" y="40" font-size="18" font-weight="bold">单事件内核开销 (ns, 越低越好)</text><rect x="80" y="270.6" width="150" height="29.4" fill="#2e7d32"/><text x="155.0" y="262.6" text-anchor="middle" font-size="14">批量累积</text><text x="155.0" y="290.3" text-anchor="middle" font-size="13" fill="#fff">73.5 ns</text><rect x="300" y="209.64" width="150" height="90.36000000000001" fill="#c62828"/><text x="375.0" y="201.64" text-anchor="middle" font-size="14">逐事件上传</text><text x="375.0" y="259.82" text-anchor="middle" font-size="13" fill="#fff">225.9 ns</text><text x="520" y="40" font-size="18" font-weight="bold">单事件用户态开销 (ns, 越低越好)</text><rect x="520" y="299.96" width="150" height="0.04" fill="#2e7d32"/><text x="595.0" y="291.96" text-anchor="middle" font-size="14">批量累积</text><text x="595.0" y="304.97999999999996" text-anchor="middle" font-size="13" fill="#fff">0.1 ns</text><rect x="740" y="-66.04000000000002" width="150" height="366.04" fill="#c62828"/><text x="815.0" y="-74.04000000000002" text-anchor="middle" font-size="14">逐事件上传</text><text x="815.0" y="121.97999999999999" text-anchor="middle" font-size="13" fill="#fff">915.1 ns</text><line x1="40" y1="300" x2="820" y2="300" stroke="#999"/><text x="40" y="470" font-size="14">方法: 同一个 tp_btf/sched_switch 挂点, 各运行 15s。批量累积=PERCPU 计数(飞行记录器模式); 逐事件=ringbuf 每事件 16B 提交。</text><text x="40" y="492" font-size="14">用户态: 批量=1 次 map 读取; 逐事件=ringbuf 连续 poll+drain (915 ns/事件)。内核成本提升 3.1x, 用户态成本降低 4 个数量级。</text></svg>